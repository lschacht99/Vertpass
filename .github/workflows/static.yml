# Builds and deploys a static export of the Next.js app to GitHub Pages.
# The dynamic /api/ask route is not included in a static export, so the Ask AI
# tab uses the built-in client-side engine (deterministic, source-cited).
# For live Gemini Flash answers, deploy to a Node host (e.g. Vercel) instead.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy static content to Pages

on:
  push:
    branches: ["claude/marriage-aos-workflow-app-e7bkjn"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
          # Project site is served from /<repo-name>. Change if using a custom domain.
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          npm run build
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
